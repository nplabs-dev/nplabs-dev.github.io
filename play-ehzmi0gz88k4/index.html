<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>NP LABS - Play</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --text:#eef0f4; --muted:#9aa3b2; --accent:#ffcf3f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:1100px; margin:0 auto; padding:48px 16px 64px; }
    h1 { margin:0 0 4px; font-size:28px; letter-spacing:.02em; }
    h1 b { color:var(--accent); }
    p { margin:0 0 32px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    .card { display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; color:inherit; text-decoration:none; transition:transform .15s,border-color .15s; }
    .card:hover, .card:focus-visible { transform:translateY(-3px); border-color:var(--accent); outline:none; }
    .card img { width:100%; aspect-ratio:16/10; object-fit:cover; background:#000; }
    .card span { padding:12px 14px; font-weight:600; }
    footer { margin-top:40px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main>
    <h1><b>NP LABS</b> &mdash; Play</h1>
    <p>Click a game to play it in your browser. Keyboard, mouse and touch supported.</p>
    <div class="grid">
      <a class="card" href="space-bugs/">
        <img src="space-bugs/thumb.jpg" alt="" loading="lazy">
        <span>Space Bugs</span>
      </a>
      <a class="card" href="road-renegade/">
        <img src="road-renegade/thumb.jpg" alt="" loading="lazy">
        <span>Road Renegade</span>
      </a>
      <a class="card" href="mosquito-smash/">
        <img src="mosquito-smash/thumb.jpg" alt="" loading="lazy">
        <span>Mosquito Smash</span>
      </a>
      <a class="card" href="mochi-pop/">
        <img src="mochi-pop/thumb.jpg" alt="" loading="lazy">
        <span>Mochi Pop</span>
      </a>
      <a class="card" href="jelly-panic/">
        <img src="jelly-panic/thumb.jpg" alt="" loading="lazy">
        <span>Jelly Panic</span>
      </a>
      <a class="card" href="chromos/">
        <img src="chromos/thumb.jpg" alt="" loading="lazy">
        <span>Chromos</span>
      </a>
      <a class="card" href="dice-royal/">
        <img src="dice-royal/thumb.jpg" alt="" loading="lazy">
        <span>Dice Royal</span>
      </a>
    </div>
    <footer>&copy; NP LABS. Private preview page.</footer>
  </main>
</body>
</html>
